# VCloud - Flutter Web in Docker (no host toolchain required).
#
#   docker compose -f docker-compose.web.yml up --build
#   open http://localhost:8080
#   docker compose -f docker-compose.web.yml down
#
# To point at a different Odoo instance, pass build args:
#   ODOO_API_BASE_URL=https://odoo.example.com \
#   ODOO_DB=production_db \
#   docker compose -f docker-compose.web.yml build
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        ODOO_API_BASE_URL: "${ODOO_API_BASE_URL:-}"
        ODOO_DB: "${ODOO_DB:-}"
    image: vcloud-web:latest
    ports:
      - "8080:80"
    restart: unless-stopped
