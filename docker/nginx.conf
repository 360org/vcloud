server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web uses path-based routing (GoRouter). Any unknown path must
    # fall back to index.html so the in-app router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; never cache the entrypoint.
    location ~* \.(js|wasm|json|png|jpg|jpeg|gif|svg|ttf|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
