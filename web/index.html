<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vcloud employee productivity MVP — chat, attendance, timesheet, tickets.">

  <!-- Required so Flutter's canvas is sized correctly; without this Edge logs
       "A 'viewport' meta element was not specified" and renders a blank page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="theme-color" content="#F1F8F2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vcloud">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vcloud</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F1F8F2; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #boot-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #64748B; flex-direction: column; gap: 14px; z-index: 0;
      font-size: 13.5px; font-weight: 600; letter-spacing: 0.3px;
    }
    #boot-loader .spinner {
      width: 34px; height: 34px; border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981; border-radius: 50%; animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Passkeys Web SDK. Must load SYNCHRONOUSLY and BEFORE the
       Flutter engine so window.PasskeyAuthenticator exists by the time the
       web plugin's registerWith() runs — otherwise it calls window.close()
       and the app dies right after booting. Self-hosted (not the GitHub
       release URL) because GitHub serves it as application/octet-stream with
       nosniff, which Edge/Chrome refuse to execute. -->
  <script src="passkeys_bundle.js" type="application/javascript"></script>

  <!-- Bootstrap the Flutter engine. The opening tag MUST be properly
       closed (async></script>) — a missing ">" makes the browser swallow
       flutter_bootstrap.js and the app never boots, leaving only the
       #0175C2 body background visible. -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Visible fallback while Flutter initialises -->
  <div id="boot-loader">
    <div class="spinner"></div>
    <div>Loading Vcloud…</div>
 </div>

  <script>
    // Hide the loader after Flutter renders its first frame. Do not attach a
    // global `error` handler here: image, avatar, and other asset failures
    // also emit browser error events, and must not cover a running app with a
    // false "failed to start" screen.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-loader');
      if (el) el.style.display = 'none';
    });
  </script>
</body>
</html>
