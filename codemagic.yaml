workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    integrations:
      # Configure this exact key name in Codemagic Team integrations.
      app_store_connect: vcloud_app_store_connect
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
        - pattern: release/ios-appstore
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        # Defined only in Codemagic. See docs/IOS_CI_TESTFLIGHT.md.
        - vcloud_ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.w360s.wcloudapp
      vars:
        APP_STORE_CONNECT_ISSUER_ID: 69a6de93-48bc-47e3-e053-5b8c7c11a4d1
        APP_STORE_CONNECT_KEY_IDENTIFIER: 3J68D9JX79
        APP_STORE_APPLE_ID: 1365622472
      flutter: stable
      xcode: latest
    scripts:
      - name: Validate release configuration
        script: |
          APP_STORE_APPLE_ID="${APP_STORE_APPLE_ID:-1365622472}"
          VCLOUD_ODOO_API_BASE_URL="${VCLOUD_ODOO_API_BASE_URL:-https://vuahethong.net}"
          echo "Validated APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID"
          echo "Validated VCLOUD_ODOO_API_BASE_URL=$VCLOUD_ODOO_API_BASE_URL"
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Build signed IPA
        script: |
          VCLOUD_ODOO_API_BASE_URL="${VCLOUD_ODOO_API_BASE_URL:-https://vuahethong.net}"
          BUILD_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)
          
          EXPORT_PLIST=$(find /Users/builder /tmp $HOME . -name "export_options.plist" 2>/dev/null | head -n 1)
          if [ -n "$EXPORT_PLIST" ]; then
            echo "Using export options plist at: $EXPORT_PLIST"
            flutter build ipa --release \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER" \
              --export-options-plist="$EXPORT_PLIST" \
              --dart-define=VCLOUD_ODOO_API_BASE_URL="$VCLOUD_ODOO_API_BASE_URL"
          else
            flutter build ipa --release \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER" \
              --dart-define=VCLOUD_ODOO_API_BASE_URL="$VCLOUD_ODOO_API_BASE_URL"
          fi
      - name: Publish to App Store Connect via Apple App Manager
        script: |
          echo "Uploading IPA to Apple TestFlight using App Manager credentials..."
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            -u "tanmnn@360.org.vn" \
            -p "ijbn-xpar-vwyk-hdyz"

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
