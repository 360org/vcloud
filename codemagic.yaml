workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    integrations:
      # Configure this exact key name in Codemagic Team integrations.
      app_store_connect: vcloud_app_store_connect
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        # Defined only in Codemagic. See docs/IOS_CI_TESTFLIGHT.md.
        - vcloud_ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.w360s.wcloudapp
      flutter: stable
      xcode: latest
    scripts:
      - name: Validate release configuration
        script: |
          APP_STORE_APPLE_ID="${APP_STORE_APPLE_ID:-1365622472}"
          VCLOUD_ODOO_API_BASE_URL="${VCLOUD_ODOO_API_BASE_URL:-https://vuahethong.com}"
          echo "Validated APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID"
          echo "Validated VCLOUD_ODOO_API_BASE_URL=$VCLOUD_ODOO_API_BASE_URL"
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Run Flutter tests
        script: flutter test
      - name: Build signed IPA
        script: |
          APP_STORE_APPLE_ID="${APP_STORE_APPLE_ID:-1365622472}"
          VCLOUD_ODOO_API_BASE_URL="${VCLOUD_ODOO_API_BASE_URL:-https://vuahethong.com}"
          BUILD_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 19) + 1))
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=VCLOUD_ODOO_API_BASE_URL="$VCLOUD_ODOO_API_BASE_URL" \
            --dart-define=VCLOUD_ODOO_DB="${VCLOUD_ODOO_DB:-}" \
            --dart-define=VCLOUD_FIREBASE_API_KEY="${VCLOUD_FIREBASE_API_KEY:-}" \
            --dart-define=VCLOUD_FIREBASE_APP_ID="${VCLOUD_FIREBASE_APP_ID:-}" \
            --dart-define=VCLOUD_FIREBASE_MESSAGING_SENDER_ID="${VCLOUD_FIREBASE_MESSAGING_SENDER_ID:-}" \
            --dart-define=VCLOUD_FIREBASE_PROJECT_ID="${VCLOUD_FIREBASE_PROJECT_ID:-}" \
            --dart-define=VCLOUD_FIREBASE_IOS_BUNDLE_ID=com.w360s.wcloudapp
      - name: Publish to App Store Connect
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            app-store-connect publish --path "$IPA_PATH" || true
          else
            echo "Searching for built IPA..."
            find build -name "*.ipa"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - "*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
