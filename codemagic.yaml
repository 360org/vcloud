workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    integrations:
      # Configure this exact key name in Codemagic Team integrations.
      app_store_connect: vcloud_app_store_connect
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      groups:
        # Defined only in Codemagic. See docs/IOS_CI_TESTFLIGHT.md.
        - vcloud_ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.w360s.wcloudapp
      flutter: stable
      xcode: latest
    scripts:
      - name: Validate release configuration
        script: |
          APP_STORE_APPLE_ID="${APP_STORE_APPLE_ID:-1365622472}"
          VCLOUD_ODOO_API_BASE_URL="${VCLOUD_ODOO_API_BASE_URL:-https://vuahethong.net}"
          echo "Validated APP_STORE_APPLE_ID=$APP_STORE_APPLE_ID"
          echo "Validated VCLOUD_ODOO_API_BASE_URL=$VCLOUD_ODOO_API_BASE_URL"
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Flutter source
        script: flutter analyze
      - name: Build signed IPA
        script: |
          APP_STORE_APPLE_ID="${APP_STORE_APPLE_ID:-1365622472}"
          BUILD_NAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 19) + 1))
          echo "Building IPA: version=$BUILD_NAME build=$BUILD_NUMBER"
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
